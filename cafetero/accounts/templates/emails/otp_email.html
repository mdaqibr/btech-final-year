<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      }
      .container {
        max-width: 520px;
        margin: 40px auto;
        background: #ffffff;
        border-radius: 14px;
        padding: 32px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      }
      .brand {
        font-size: 24px;
        font-weight: 700;
        color: #4f46e5;
        margin-bottom: 20px;
        text-align: center;
      }
      .otp {
        background: #eef2ff;
        color: #1e1b4b;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 12px;
        text-align: center;
        padding: 16px;
        border-radius: 12px;
        margin: 24px 0;
      }
      .footer {
        font-size: 13px;
        color: #6b7280;
        text-align: center;
        margin-top: 32px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="brand">{{ brand_name }}</div>

      <p>Hello,</p>
      <p>Your email verification OTP is:</p>

      <div class="otp">{{ otp }}</div>

      <p>This OTP is valid for <strong>60 minutes</strong>.</p>
      <p>If you did not request this, you can safely ignore this email.</p>

      <div class="footer">
        © {{ brand_name }} — Secure & Smart Vendor Platform
      </div>
    </div>
  </body>
</html>
