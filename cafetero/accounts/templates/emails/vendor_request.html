<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI";
      }
      .card {
        max-width: 600px;
        margin: 40px auto;
        background: #ffffff;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      }
      .brand {
        font-size: 22px;
        font-weight: 700;
        color: #4f46e5;
        margin-bottom: 20px;
      }
      .row {
        padding: 8px 0;
      }
      .label {
        font-weight: 600;
        color: #374151;
      }
      .status {
        display: inline-block;
        background: #eef2ff;
        color: #4338ca;
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 600;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">{{ brand_name }}</div>

      <p>Hello {{ vendor_name }},</p>

      <p>You have received a new vendor request:</p>

      <div class="row">
        <span class="label">Company:</span> {{ company_name }}
      </div>
      <div class="row">
        <span class="label">Branch:</span> {{ branch_name }}
      </div>
      <div class="row">
        <span class="label">Building:</span> {{ building_name }}
      </div>
      <div class="row"><span class="label">Floor:</span> {{ floor_name }}</div>

      <div class="status">Status: {{ status }}</div>

      <p style="margin-top: 24px">
        Please log in to Cafetero to review this request.
      </p>

      <p>Thanks,<br />Cafetero Team</p>
    </div>
  </body>
</html>
